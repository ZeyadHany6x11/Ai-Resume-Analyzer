services:
  api:
    build: .
    image: ai-resume-analyzer:local
    command: python -m uvicorn resume_analyzer.api.main:app --host 0.0.0.0 --port 8000
    environment:
      RESUME_ANALYZER_ENVIRONMENT: production
      RESUME_ANALYZER_DATABASE_PATH: /data/resume_analyzer.db
      RESUME_ANALYZER_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  streamlit:
    build: .
    image: ai-resume-analyzer:local
    command: python -m streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      RESUME_ANALYZER_ENVIRONMENT: production
      RESUME_ANALYZER_DATABASE_PATH: /data/resume_analyzer.db
      RESUME_ANALYZER_LOG_LEVEL: INFO
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
